services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: typstr
      POSTGRES_USER: typstr
      POSTGRES_PASSWORD: typstr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typstr -d typstr"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "Typstr"
      LDAP_DOMAIN: "example.org"
      LDAP_ADMIN_PASSWORD: "adminpassword"
      LDAP_TLS: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
    volumes:
      - ./openldap/custom:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - openldap-data:/var/lib/ldap
      - openldap-config:/etc/ldap/slapd.d
    ports:
      - "389:389"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
      args:
        BACKEND_BASE_IMAGE: "${BACKEND_BASE_IMAGE:-typstr-backend-texbase:latest}"
    environment:
      PORT: "3000"
      LOG_LEVEL: "${LOG_LEVEL:-DEBUG}"
      DATABASE_URL: "postgresql://typstr:typstr@postgres:5432/typstr"
      SESSION_REDIS_URL: "redis://redis:6379/0"
      FRONTEND_ORIGIN: "http://localhost:8989"
      NODE_ENV: development
      MAX_CONCURRENT_COMPILES: "4"
      SESSION_SECRET: "dev-session-secret"
      COLLABORATION_SECRET: "dev-collaboration-secret"
      COOKIE_SECURE: "false"
      LOCAL_AUTH_BYPASS: "true"
      LOCAL_AUTH_EMAIL: "dev@typstr.local"
      LOCAL_AUTH_NAME: "Local Developer"
      LOCAL_FILE_STORAGE: "true"
      LOCAL_STORAGE_ROOT: "/app/.local-storage"
      LDAP_ENABLED: "true"
      LDAP_URL: "ldap://openldap:389"
      LDAP_BIND_DN: "cn=admin,dc=example,dc=org"
      LDAP_BIND_PASSWORD: "adminpassword"
      LDAP_SEARCH_BASE: "dc=example,dc=org"
      LDAP_SEARCH_FILTER: "(|(mail={{username}})(uid={{username}})(cn={{username}}))"
      LDAP_EMAIL_ATTRIBUTE: "mail"
      LDAP_NAME_ATTRIBUTE: "cn"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_CALLBACK_URL: "${DEV_GOOGLE_CALLBACK_URL:-http://localhost:8989/api/auth/google/callback}"
      GOOGLE_DRIVE_ROOT_NAME: "${GOOGLE_DRIVE_ROOT_NAME:-typstr}"
      ORCID_CLIENT_ID: "${ORCID_CLIENT_ID:-}"
      ORCID_CLIENT_SECRET: "${ORCID_CLIENT_SECRET:-}"
      ORCID_CALLBACK_URL: "${DEV_ORCID_CALLBACK_URL:-http://localhost:8989/api/auth/orcid/callback}"
      ORCID_AUTHORIZE_URL: "${ORCID_AUTHORIZE_URL:-https://orcid.org/oauth/authorize}"
      ORCID_TOKEN_URL: "${ORCID_TOKEN_URL:-https://orcid.org/oauth/token}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-Typstr <typstr@arleon.com.tr>}"
      REQUEST_BODY_LIMIT_MB: "${REQUEST_BODY_LIMIT_MB:-64}"
      XDG_CACHE_HOME: "/home/node/.cache"
      TINYMIST_BIN: "/usr/local/bin/tinymist"
      TEXLAB_BIN: "/usr/local/bin/texlab"
    volumes:
      - ./.local-storage:/app/.local-storage
      - ./backend/src:/app/src:ro
      - ./backend/package.json:/app/package.json:ro
      - typst-cache:/home/node/.cache
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_LOG_LEVEL: "${VITE_LOG_LEVEL:-ERROR}"
      VITE_API_BASE_URL: ""
      VITE_WS_BASE_URL: ""
      VITE_DEV_PROXY_TARGET: "http://backend:3000"
      VITE_DEV_PROXY_WS_TARGET: "ws://backend:3000"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
    ports:
      - "8989:8989"
    depends_on:
      nginx:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  openldap-data:
  openldap-config:
  typst-cache:
